services:
  app:
    build: .
    container_name: scraper-app
    ports:
      - "3000:3000"
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_SESSION: ${TELEGRAM_SESSION}
      TELEGRAM_SESSION_FILE_PATH: /app/session/.session
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      IMPORT_CONCURRENCY: ${IMPORT_CONCURRENCY:-1}
      PORT: 3000
    volumes:
      - telegram_session:/app/session
    depends_on:
      - postgres
      - minio

  postgres:
    image: postgres:15-alpine
    container_name: scraper-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegram_archive}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: scraper-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio_admin_user}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio_admin_password}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  telegram_session:
  postgres_data:
  minio_data:
