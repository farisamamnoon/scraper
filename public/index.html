<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive Dashboard</title>
  <meta name="description" content="Telegram channel archive importer — monitor import progress and manage channel tracking.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ── Design tokens ──────────────────────────────────────── */
    :root {
      --bg:          #111111;
      --surface:     #1a1a1a;
      --surface-2:   #222222;
      --border:      #2d2d2d;
      --border-2:    #3d3d3d;
      --text:        #ededed;
      --text-2:      #888;
      --text-3:      #555;

      /* Status colors — only hue in the entire UI */
      --s-pending:   #52525b;
      --s-running:   #3b82f6;
      --s-done:      #22c55e;
      --s-failed:    #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Topbar ─────────────────────────────────────────────── */
    .topbar {
      height: 48px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 12px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Inline Telegram plane mark */
    .brand-mark {
      width: 24px;
      height: 24px;
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      border-radius: 6px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .brand-mark svg { display: block; }

    .brand-sep {
      width: 1px;
      height: 16px;
      background: var(--border-2);
    }

    .brand-name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-3);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--text-2);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--s-done);
      animation: blink 2.8s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.25; }
    }

    /* ── Page body ──────────────────────────────────────────── */
    .page {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 20px 80px;
    }

    /* ── Stats strip ────────────────────────────────────────── */
    .stats-strip {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 24px;
      background: var(--surface);
    }

    .stat-cell {
      flex: 1;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .stat-cell + .stat-cell {
      border-left: 1px solid var(--border);
    }

    .stat-num {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.04em;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .stat-lbl {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-2);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    /* ── Section label ──────────────────────────────────────── */
    .section-lbl {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--text-3);
      margin-bottom: 8px;
    }

    /* ── Add channel form ───────────────────────────────────── */
    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .add-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 13px;
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .add-input::placeholder { color: var(--text-3); }

    .add-input:focus {
      border-color: var(--border-2);
      background: var(--surface-2);
    }

    .add-btn {
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 6px;
      padding: 9px 16px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
      letter-spacing: -0.01em;
    }

    .add-btn:hover { opacity: 0.85; }
    .add-btn:active { opacity: 0.7; }
    .add-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Toast ──────────────────────────────────────────────── */
    .toast {
      position: relative;
      display: none;
      font-size: 13px;
      padding: 9px 32px 9px 13px;
      border-radius: 6px;
      border-left: 3px solid;
      margin-bottom: 12px;
    }

    .toast.success {
      display: flex;
      align-items: center;
      background: rgba(34, 197, 94, 0.07);
      border-color: var(--s-done);
      color: #86efac;
    }

    .toast.error {
      display: flex;
      align-items: center;
      background: rgba(239, 68, 68, 0.07);
      border-color: var(--s-failed);
      color: #fca5a5;
    }

    .toast-close {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: inherit;
      opacity: 0.6;
      cursor: pointer;
      font-size: 11px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s;
    }

    .toast-close:hover {
      opacity: 1;
    }

    .toast-link-btn {
      background: none;
      border: none;
      color: inherit;
      text-decoration: underline;
      cursor: pointer;
      font-weight: 500;
      padding: 0;
      margin-left: 6px;
      font-family: inherit;
      font-size: inherit;
      opacity: 0.85;
      transition: opacity 0.15s;
    }

    .toast-link-btn:hover {
      opacity: 1;
    }

    /* ── Channel list ───────────────────────────────────────── */
    .list-shell {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .list-head {
      display: flex;
      align-items: center;
      padding: 8px 14px 8px 17px; /* +3px left for the border offset */
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }

    .lh-name   { flex: 1; }
    .lh-msgs   { width: 84px; text-align: right; }
    .lh-lastid { width: 76px; text-align: right; }
    .lh-status { width: 80px; text-align: right; }
    .lh-arrow  { width: 14px; }

    .col-hdr-text {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-3);
    }

    /* Rows */
    .ch-row {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      gap: 10px;
      border-left: 3px solid transparent;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      transition: background 0.12s;
    }

    .ch-row:last-child { border-bottom: none; }
    .ch-row:hover { background: rgba(255,255,255,0.025); }

    .ch-row.pending   { border-left-color: var(--s-pending); }
    .ch-row.running   { border-left-color: var(--s-running); background: rgba(59,130,246,0.03); }
    .ch-row.completed { border-left-color: var(--s-done); }
    .ch-row.failed    { border-left-color: var(--s-failed); }

    /* Row columns */
    .row-name   { flex: 1; min-width: 0; }
    .row-msgs   { width: 84px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text); }
    .row-lastid { width: 76px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-2); }
    .row-status { width: 80px; text-align: right; }
    .row-arrow  { width: 14px; text-align: right; color: var(--text-3); opacity: 0; transition: opacity 0.12s, transform 0.12s; font-size: 13px; }

    .ch-row:hover .row-arrow { opacity: 1; transform: translateX(2px); }

    .ch-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }

    .ch-user {
      font-size: 11.5px;
      color: var(--text-2);
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0;
    }

    /* Status pill */
    .pill {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 2px 7px;
      border-radius: 4px;
      font-family: 'IBM Plex Sans', sans-serif;
    }

    .pill.pending   { color: #a1a1aa; background: rgba(113,113,122,0.12); }
    .pill.running   { color: #93c5fd; background: rgba(59,130,246,0.13); }
    .pill.completed { color: #86efac; background: rgba(34,197,94,0.12); }
    .pill.failed    { color: #fca5a5; background: rgba(239,68,68,0.12); }

    /* Empty state */
    .empty-row {
      padding: 48px 24px;
      text-align: center;
      color: var(--text-3);
      font-size: 13px;
      background: var(--bg);
    }

    /* ── Explorer modal ─────────────────────────────────────── */
    .explorer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(3px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .explorer-overlay.open { display: flex; }

    .exp-box {
      width: 95vw;
      height: 88vh;
      max-width: 1260px;
      background: var(--surface);
      border: 1px solid var(--border-2);
      border-radius: 12px;
      display: grid;
      grid-template-rows: 48px 1fr;
      overflow: hidden;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7);
    }

    .exp-topbar {
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .exp-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .exp-close {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-2);
      cursor: pointer;
      font-size: 13px;
      display: grid;
      place-items: center;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }

    .exp-close:hover {
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .exp-delete {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-2);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }

    .exp-delete:hover {
      background: rgba(239, 68, 68, 0.16);
      border-color: rgba(239, 68, 68, 0.4);
      color: #ef4444;
    }

    .exp-delete:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .exp-body {
      display: grid;
      grid-template-columns: 268px 1fr 340px;
      overflow: hidden;
    }

    /* Column 1: message list */
    .exp-col-list {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }

    .exp-col-hdr {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-3);
      flex-shrink: 0;
    }

    .exp-list-scroll {
      flex: 1;
      overflow-y: auto;
    }

    .exp-msg-item {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }

    .exp-msg-item:last-child { border-bottom: none; }
    .exp-msg-item:hover { background: var(--surface); }

    .exp-msg-item.active {
      background: var(--surface-2);
      border-left: 2px solid var(--s-running);
      padding-left: 12px;
    }

    .exp-msg-meta {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--text-3);
      margin-bottom: 4px;
    }

    .exp-msg-snippet {
      font-size: 12px;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .exp-media-tag {
      display: inline-block;
      margin-top: 4px;
      font-size: 10px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 3px;
      background: rgba(59, 130, 246, 0.1);
      color: #93c5fd;
    }

    /* Column 2: detail */
    .exp-col-detail {
      display: flex;
      flex-direction: column;
      padding: 18px;
      overflow-y: auto;
      gap: 14px;
      border-right: 1px solid var(--border);
    }

    .exp-detail-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-3);
      font-size: 13px;
    }

    .exp-block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 13px 15px;
    }

    .exp-block-lbl {
      font-size: 10.5px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-3);
      margin-bottom: 8px;
    }

    .exp-msg-text {
      font-size: 13px;
      line-height: 1.65;
      color: var(--text);
      white-space: pre-wrap;
    }

    /* Media */
    .media-shell {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .media-preview {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      min-height: 80px;
    }

    .media-preview img {
      max-width: 100%;
      max-height: 340px;
      object-fit: contain;
    }

    .media-preview video {
      width: 100%;
      max-height: 340px;
    }

    .media-preview audio {
      width: 100%;
      padding: 16px;
    }

    .media-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .media-fname {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--text);
    }

    .media-fmeta {
      font-size: 11px;
      color: var(--text-2);
      margin-top: 1px;
    }

    .media-dl {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      border-radius: 5px;
      padding: 5px 12px;
      text-decoration: none;
      transition: background 0.12s;
      white-space: nowrap;
    }

    .media-dl:hover { background: var(--border); }

    /* Column 3: JSON */
    .exp-col-json {
      display: flex;
      flex-direction: column;
      background: #0d0d0d;
      overflow: hidden;
    }

    .json-hdr {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .json-hdr-lbl {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-3);
    }

    .json-copy-btn {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-2);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 10px;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
      font-family: 'IBM Plex Sans', sans-serif;
    }

    .json-copy-btn:hover { background: var(--surface-2); color: var(--text); }

    .json-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }

    .json-pre {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11.5px;
      line-height: 1.7;
      color: #8a8a8a;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Scrollbar styling */
    .exp-list-scroll::-webkit-scrollbar,
    .exp-col-detail::-webkit-scrollbar,
    .json-scroll::-webkit-scrollbar { width: 4px; }
    .exp-list-scroll::-webkit-scrollbar-track,
    .exp-col-detail::-webkit-scrollbar-track,
    .json-scroll::-webkit-scrollbar-track { background: transparent; }
    .exp-list-scroll::-webkit-scrollbar-thumb,
    .exp-col-detail::-webkit-scrollbar-thumb,
    .json-scroll::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 680px) {
      .page { padding: 20px 14px 60px; }
      .row-lastid, .lh-lastid { display: none; }
      .stats-strip { flex-direction: column; }
      .stat-cell + .stat-cell { border-left: none; border-top: 1px solid var(--border); }
      .add-row { flex-direction: column; }
      .add-btn { width: 100%; }
      .brand-sub { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .live-dot { animation: none; }
      .ch-row   { transition: none; }
    }
  </style>
</head>
<body>

  <!-- ── Topbar ────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand-mark">
        <svg width="14" height="14" viewBox="0 0 20 20" fill="none">
          <path d="M2 10L18 4L14 17L10 14L8 17L7 13L2 10Z" fill="#ededed" opacity="0.85"/>
        </svg>
      </div>
      <span class="brand-name">Archive</span>
      <div class="brand-sep"></div>
      <span class="brand-sub">Telegram Importer</span>
    </div>
    <div class="topbar-right">
      <div class="live-dot" id="live-dot"></div>
      <span>Live</span>
    </div>
  </header>

  <!-- ── Main ─────────────────────────────────────────────── -->
  <main class="page">

    <!-- Stats -->
    <div class="stats-strip">
      <div class="stat-cell">
        <span class="stat-num" id="stat-msgs">—</span>
        <span class="stat-lbl">Messages archived</span>
      </div>
      <div class="stat-cell">
        <span class="stat-num" id="stat-chans">—</span>
        <span class="stat-lbl">Channels tracked</span>
      </div>
      <div class="stat-cell">
        <span class="stat-num" id="stat-active">—</span>
        <span class="stat-lbl">Active imports</span>
      </div>
    </div>

    <!-- Add channel -->
    <p class="section-lbl">Add channel</p>
    <div class="toast" id="banner"></div>
    <form class="add-row" id="add-form">
      <input class="add-input" id="ch-input" type="text"
             placeholder="@channel or t.me/channel" autocomplete="off" required>
      <button class="add-btn" id="add-btn" type="submit">Track channel</button>
    </form>

    <!-- Channel list -->
    <p class="section-lbl">Import queue</p>
    <div class="list-shell">
      <div class="list-head">
        <div class="lh-name  col-hdr-text">Channel</div>
        <div class="lh-msgs  col-hdr-text">Messages</div>
        <div class="lh-lastid col-hdr-text">Last ID</div>
        <div class="lh-status col-hdr-text">Status</div>
        <div class="lh-arrow"></div>
      </div>
      <div id="ch-list">
        <div class="empty-row">Loading…</div>
      </div>
    </div>

  </main>

  <!-- ── Explorer modal ───────────────────────────────────── -->
  <div class="explorer-overlay" id="exp-overlay">
    <div class="exp-box">
      <div class="exp-topbar">
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="exp-delete" id="exp-delete-btn" onclick="deleteCurrentChannel()" title="Delete Channel">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash2-icon lucide-trash-2"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
          <span class="exp-title" id="exp-title-text">Channel Explorer</span>
        </div>
        <button class="exp-close" id="exp-close-btn" onclick="closeExplorer()">✕</button>
      </div>
      <div class="exp-body">

        <!-- Col 1: message list -->
        <div class="exp-col-list">
          <div class="exp-col-hdr">Messages</div>
          <div class="exp-list-scroll" id="exp-list-scroll">
            <div style="padding:20px;text-align:center;color:var(--text-3);font-size:12px;">Select a channel</div>
          </div>
        </div>

        <!-- Col 2: detail + media -->
        <div class="exp-col-detail" id="exp-col-detail">
          <div class="exp-detail-empty">
            <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" opacity="0.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
            <span>Select a message</span>
          </div>
        </div>

        <!-- Col 3: JSON -->
        <div class="exp-col-json">
          <div class="json-hdr">
            <span class="json-hdr-lbl">JSON payload</span>
            <button class="json-copy-btn" id="json-copy-btn" onclick="copyJson()">Copy</button>
          </div>
          <div class="json-scroll">
            <pre class="json-pre" id="json-pre">// Select a message</pre>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ── Logs modal ───────────────────────────────────────── -->
  <div class="explorer-overlay" id="logs-overlay">
    <div class="exp-box" style="max-width: 500px; height: auto; max-height: 75vh;">
      <div class="exp-topbar">
        <span class="exp-title">Registration Status Logs</span>
        <button class="exp-close" id="logs-close-btn" onclick="closeLogsModal()">✕</button>
      </div>
      <div class="exp-body" style="display: block; overflow-y: auto; padding: 20px; grid-template-columns: 1fr;">
        <div id="logs-content" style="color: var(--text-2); line-height: 1.6;"></div>
      </div>
    </div>
  </div>

  <script>
    // Intercept 401 Unauthorized API responses and redirect to login
    (function() {
      const originalFetch = window.fetch;
      window.fetch = async function(...args) {
        try {
          const res = await originalFetch(...args);
          if (res.status === 401) {
            window.location.href = '/login.html';
          }
          return res;
        } catch (err) {
          throw err;
        }
      };
    })();

    // ── Refs ─────────────────────────────────────────────────
    const addForm   = document.getElementById('add-form');
    const chInput   = document.getElementById('ch-input');
    const addBtn    = document.getElementById('add-btn');
    const banner    = document.getElementById('banner');
    const chList    = document.getElementById('ch-list');
    const statMsgs  = document.getElementById('stat-msgs');
    const statChans = document.getElementById('stat-chans');
    const statActive= document.getElementById('stat-active');
    let trackedChannels = []; // Cache of tracked channels for duplicate detection

    // ── Utils ────────────────────────────────────────────────
    const fmt = n => Number(n || 0).toLocaleString();

    function esc(s) {
      if (!s) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
        + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    }

    function fmtBytes(b) {
      if (!b) return '0 B';
      const K = 1024, units = ['B','KB','MB','GB'];
      const i = Math.floor(Math.log(b) / Math.log(K));
      return (b / Math.pow(K, i)).toFixed(1) + ' ' + units[i];
    }

    // ── Banner ───────────────────────────────────────────────
    let bannerTimeout = null;
    function showBanner(msg, type, isHtml = false, autoDismissMs = 0) {
      if (bannerTimeout) {
        clearTimeout(bannerTimeout);
        bannerTimeout = null;
      }

      const container = document.createElement('div');
      container.style.flex = '1';
      if (isHtml) {
        container.innerHTML = msg;
      } else {
        container.textContent = msg;
      }

      banner.innerHTML = '';
      banner.appendChild(container);

      // Inject close button
      const closeBtn = document.createElement('button');
      closeBtn.className = 'toast-close';
      closeBtn.type = 'button';
      closeBtn.innerHTML = '✕';
      closeBtn.onclick = hideBanner;
      banner.appendChild(closeBtn);

      banner.className = `toast ${type}`;

      if (autoDismissMs > 0) {
        bannerTimeout = setTimeout(hideBanner, autoDismissMs);
      }
    }
    function hideBanner() {
      if (bannerTimeout) {
        clearTimeout(bannerTimeout);
        bannerTimeout = null;
      }
      banner.className = 'toast';
    }
 
    // ── Add channel ──────────────────────────────────────────
    addForm.addEventListener('submit', async e => {
      e.preventDefault();
      const usernameInput = chInput.value.trim();
      if (!usernameInput) return;
 
      // Parse inputs by split on comma, newline, and spaces
      const rawUsernames = usernameInput.split(/[\s,]+/).map(u => u.trim()).filter(Boolean);
      if (rawUsernames.length === 0) return;
 
      const cleanUsernames = rawUsernames.map(u => {
        return u
          .replace(/^(https?:\/\/)?(www\.)?t\.me\//, '')
          .replace(/^@/, '')
          .trim();
      });
 
      const usernameRegex = /^[a-zA-Z0-9_]{5,32}$/;
      const validationErrors = [];
      const validUsernames = [];
 
      cleanUsernames.forEach((u, idx) => {
        const raw = rawUsernames[idx];
        if (!usernameRegex.test(u)) {
          validationErrors.push(`@${esc(u)}: Invalid Telegram username format.`);
          return;
        }
        const alreadyTracked = trackedChannels.some(ch => 
          ch.channel_username && ch.channel_username.toLowerCase() === u.toLowerCase()
        );
        if (alreadyTracked) {
          validationErrors.push(`@${esc(u)}: Already being tracked.`);
          return;
        }
        validUsernames.push(u);
      });
 
      // If none of the inputs are valid/new, show validation errors immediately
      if (validUsernames.length === 0) {
        if (validationErrors.length === 1) {
          showBanner(validationErrors[0], 'error');
        } else {
          lastImportResults = { successes: [], failures: [], validationErrors };
          const errSummary = `Failed to add channels. <button type="button" class="toast-link-btn" onclick="showImportDetails()">View logs</button>`;
          showBanner(errSummary, 'error', true);
        }
        return;
      }
 
      addBtn.disabled = true;
      addBtn.textContent = 'Checking…';
      hideBanner();
 
      try {
        const res  = await fetch('/api/channels', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: validUsernames.join(',') })
        });
        const data = await res.json();
 
        if (data.success) {
          let bannerHtml = '';
          let bannerType = 'success';
          let autoDismissMs = 0;
 
          if (data.results) {
            // Multi-channel response format
            const backendSuccesses = data.results.filter(r => r.success);
            const backendFailures = data.results.filter(r => !r.success);
 
            lastImportResults = {
              successes: backendSuccesses,
              failures: backendFailures,
              validationErrors: [...validationErrors]
            };
 
            const successCount = backendSuccesses.length;
            const failureCount = backendFailures.length + validationErrors.length;
 
            if (failureCount === 0) {
              bannerType = 'success';
              if (successCount === 1) {
                bannerHtml = `@${esc(backendSuccesses[0].channel.channel_username)} added to the import queue.`;
                autoDismissMs = 5000;
              } else {
                bannerHtml = `Successfully added ${successCount} channels. <button type="button" class="toast-link-btn" onclick="showImportDetails()">View details</button>`;
                autoDismissMs = 6000;
              }
            } else if (successCount === 0) {
              bannerType = 'error';
              if (failureCount === 1) {
                const singleErr = validationErrors[0] || backendFailures[0].error;
                bannerHtml = singleErr;
              } else {
                bannerHtml = `Failed to add ${failureCount} channels. <button type="button" class="toast-link-btn" onclick="showImportDetails()">View logs</button>`;
              }
            } else {
              bannerType = 'success';
              bannerHtml = `Added ${successCount} channels, but ${failureCount} failed. <button type="button" class="toast-link-btn" onclick="showImportDetails()">View details</button>`;
            }
          } else {
            // Single-channel legacy format
            lastImportResults = null;
            bannerType = 'success';
            bannerHtml = `@${esc(data.channel.channel_username)} added to the import queue.`;
            autoDismissMs = 5000;
          }
 
          showBanner(bannerHtml, bannerType, true, autoDismissMs);
          chInput.value = '';
          await fetchProgress();
        } else {
          showBanner(data.error || 'Failed to add channel.', 'error');
        }
      } catch (err) {
        showBanner('Network error — could not reach the server.', 'error');
      } finally {
        addBtn.disabled = false;
        addBtn.textContent = 'Track channel';
      }
    });

    // ── Channel list: smart diff update (kills the flicker) ──
    // Key insight: only rebuild DOM when the channel *set* changes.
    // When polling with same channels, patch values in-place.
    let _channelKey = '';   // serialised channel ids to detect structural changes

    function renderChannels(channels) {
      trackedChannels = channels || [];
      if (!channels || channels.length === 0) {
        _channelKey = '';
        chList.innerHTML = '<div class="empty-row">No channels tracked yet — add one above.</div>';
        return;
      }

      const newKey = channels.map(c => c.channel_id).join(',');

      if (newKey === _channelKey) {
        // Same set of channels: patch values in-place, no DOM rebuild
        channels.forEach(ch => {
          const row = document.getElementById(`cr-${ch.channel_id}`);
          if (!row) return;
          // Status class
          row.className = `ch-row ${ch.status}`;
          // Pill
          const pill = row.querySelector('.pill');
          if (pill) { pill.className = `pill ${ch.status}`; pill.textContent = ch.status; }
          // Numbers (use data attrs to skip DOM write when unchanged)
          const msgsEl = row.querySelector('.js-msgs');
          const newMsgs = fmt(ch.message_count);
          if (msgsEl && msgsEl.textContent !== newMsgs) msgsEl.textContent = newMsgs;
          const idEl = row.querySelector('.js-lastid');
          const newId = ch.last_processed_message_id || '—';
          if (idEl && idEl.textContent !== String(newId)) idEl.textContent = newId;
        });
        return;
      }

      // Channel set changed — full rebuild only here
      _channelKey = newKey;
      chList.innerHTML = channels.map(ch => {
        const title  = esc(ch.title || 'Resolving…');
        const uname  = ch.channel_username ? `@${esc(ch.channel_username)}` : '—';
        const status = ch.status || 'pending';
        return `
          <div class="ch-row ${status}" id="cr-${ch.channel_id}"
               onclick="openExplorer('${esc(ch.channel_id)}', '${title}')">
            <div class="row-name">
              <div class="ch-title">${title}</div>
              <div class="ch-user">${uname}</div>
            </div>
            <div class="row-msgs js-msgs">${fmt(ch.message_count)}</div>
            <div class="row-lastid js-lastid">${esc(String(ch.last_processed_message_id || '—'))}</div>
            <div class="row-status"><span class="pill ${status}">${status}</span></div>
            <div class="row-arrow">›</div>
          </div>`;
      }).join('');
    }

    // ── Stats ────────────────────────────────────────────────
    function renderStats(s) {
      if (!s) return;
      statMsgs.textContent   = fmt(s.total_messages);
      statChans.textContent  = fmt(s.total_channels);
      statActive.textContent = fmt(s.active_imports);
    }

    // ── Polling ──────────────────────────────────────────────
    async function fetchProgress() {
      try {
        const res  = await fetch('/api/progress');
        const data = await res.json();
        if (data.success) {
          renderStats(data.stats);
          renderChannels(data.channels);
        }
      } catch (err) {
        console.error('[poll error]', err);
      }
    }

    fetchProgress();
    setInterval(fetchProgress, 2000);

    // ── Logs Modal ───────────────────────────────────────────
    let lastImportResults = null;

    function openLogsModal(contentHtml) {
      document.getElementById('logs-content').innerHTML = contentHtml;
      document.getElementById('logs-overlay').classList.add('open');
    }

    function closeLogsModal() {
      document.getElementById('logs-overlay').classList.remove('open');
    }

    function showImportDetails() {
      if (!lastImportResults) return;
      const { successes, failures, validationErrors } = lastImportResults;
      
      let html = '';
      if (successes.length > 0) {
        html += `<h4 style="margin-bottom: 8px; color: var(--text); font-size: 13px; font-weight: 600;">Successfully Registered (${successes.length})</h4>`;
        html += `<ul style="margin-bottom: 20px; padding-left: 18px; list-style-type: disc; color: #86efac; font-size: 12px; display: flex; flex-direction: column; gap: 4px;">`;
        successes.forEach(s => {
          html += `<li>@${esc(s.channel.channel_username)} - ${esc(s.channel.title)}</li>`;
        });
        html += `</ul>`;
      }
      
      if (validationErrors.length > 0 || failures.length > 0) {
        html += `<h4 style="margin-bottom: 8px; color: var(--text); font-size: 13px; font-weight: 600;">Failures (${validationErrors.length + failures.length})</h4>`;
        html += `<ul style="padding-left: 18px; list-style-type: disc; color: #fca5a5; font-size: 12px; display: flex; flex-direction: column; gap: 4px;">`;
        validationErrors.forEach(e => {
          html += `<li>${e}</li>`;
        });
        failures.forEach(f => {
          html += `<li>@${esc(f.username)}: ${esc(f.error)}</li>`;
        });
        html += `</ul>`;
      }
      
      openLogsModal(html);
    }

    // ── Explorer ─────────────────────────────────────────────
    let currentChannelId = null;
    let expMessages = [];
    let selectedMsg = null;

    async function openExplorer(channelId, title) {
      currentChannelId = channelId;
      document.getElementById('exp-title-text').textContent = title;
      document.getElementById('exp-overlay').classList.add('open');
      document.getElementById('exp-list-scroll').innerHTML =
        '<div style="padding:20px;text-align:center;color:var(--text-3);font-size:12px;">Loading…</div>';
      resetDetail();

      try {
        const res  = await fetch(`/api/channels/${channelId}/messages`);
        const data = await res.json();
        expMessages = data.success ? data.messages : [];
        renderMsgList(expMessages);
      } catch {
        document.getElementById('exp-list-scroll').innerHTML =
          '<div style="padding:20px;text-align:center;color:#fca5a5;font-size:12px;">Failed to load.</div>';
      }
    }

    function closeExplorer() {
      document.getElementById('exp-overlay').classList.remove('open');
      currentChannelId = null;
      expMessages = [];
      selectedMsg = null;
    }

    async function deleteCurrentChannel() {
      if (!currentChannelId) return;
      const title = document.getElementById('exp-title-text').textContent;
      if (!confirm(`Are you sure you want to delete channel "${title}" and all its messages? This action cannot be undone.`)) {
        return;
      }

      const btn = document.getElementById('exp-delete-btn');
      btn.disabled = true;
      try {
        const res = await fetch(`/api/channels/${currentChannelId}`, {
          method: 'DELETE'
        });
        const data = await res.json();
        if (data.success) {
          showBanner(`Channel "${title}" has been deleted.`, 'success');
          closeExplorer();
          await fetchProgress();
        } else {
          alert(data.error || 'Failed to delete channel.');
        }
      } catch (err) {
        alert('Network error — could not reach the server.');
      } finally {
        btn.disabled = false;
      }
    }

    function resetDetail() {
      selectedMsg = null;
      document.getElementById('exp-col-detail').innerHTML = `
        <div class="exp-detail-empty">
          <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" opacity="0.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
          </svg>
          <span>Select a message</span>
        </div>`;
      document.getElementById('json-pre').textContent = '// Select a message';
    }

    function mediaLabel(t) {
      return { photo: '📷 Photo', video: '🎥 Video', audio: '🎵 Audio', voice: '🎤 Voice', document: '📄 Document' }[t] || '📎 Media';
    }

    function renderMsgList(msgs) {
      const el = document.getElementById('exp-list-scroll');
      if (!msgs || !msgs.length) {
        el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-3);font-size:12px;">No messages yet.</div>';
        return;
      }
      el.innerHTML = msgs.map((m, i) => {
        const j = m.telegram_json || {};
        const snippet = (j.text || '').trim() || '<em>No text</em>';
        const tag = j.media
          ? `<span class="exp-media-tag">${mediaLabel(j.media.media_type)}</span>` : '';
        return `
          <div class="exp-msg-item" id="mi-${m.message_id}" onclick="selectMsg(${i})">
            <div class="exp-msg-meta">
              <span>#${m.message_id}</span>
              <span>${fmtDate(m.message_date)}</span>
            </div>
            <div class="exp-msg-snippet">${esc(snippet)}</div>
            ${tag}
          </div>`;
      }).join('');
    }

    function selectMsg(i) {
      document.querySelectorAll('.exp-msg-item').forEach(el => el.classList.remove('active'));
      const m = expMessages[i];
      selectedMsg = m;
      const itemEl = document.getElementById(`mi-${m.message_id}`);
      if (itemEl) itemEl.classList.add('active');

      const j = m.telegram_json || {};
      document.getElementById('json-pre').textContent = JSON.stringify(m, null, 2);

      let mediaBlock = '';
      if (m.media_key && j.media) {
        const url   = `/api/media?key=${encodeURIComponent(m.media_key)}`;
        const dlUrl = url + '&download=true';
        const fname = j.media.file_name || 'file';
        const mime  = j.media.mime_type || '';
        const size  = fmtBytes(j.media.file_size);

        let preview = `<div style="padding:20px;color:var(--text-3);font-size:13px;">📄 ${esc(fname)}</div>`;
        if (mime.startsWith('image/')) {
          preview = `<img src="${url}" alt="${esc(fname)}" style="max-width:100%;max-height:320px;object-fit:contain;">`;
        } else if (mime.startsWith('video/')) {
          preview = `<video src="${url}" controls style="width:100%;max-height:320px;"></video>`;
        } else if (mime.startsWith('audio/')) {
          preview = `<audio src="${url}" controls style="width:100%;padding:16px;"></audio>`;
        }

        mediaBlock = `
          <div class="media-shell">
            <div class="media-preview">${preview}</div>
            <div class="media-footer">
              <div>
                <div class="media-fname">${esc(fname)}</div>
                <div class="media-fmeta">${size} · ${esc(mime)}</div>
              </div>
              <a class="media-dl" href="${dlUrl}" target="_blank">
                <svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                Download
              </a>
            </div>
          </div>`;
      }

      document.getElementById('exp-col-detail').innerHTML = `
        <div class="exp-block">
          <p class="exp-block-lbl">Message #${m.message_id} · ${fmtDate(m.message_date)}</p>
          <div class="exp-msg-text">${esc(j.text || '') || '<span style="color:var(--text-3);font-style:italic;">No text content</span>'}</div>
        </div>
        ${mediaBlock}`;
    }

    async function copyJson() {
      if (!selectedMsg) return;
      await navigator.clipboard.writeText(JSON.stringify(selectedMsg, null, 2));
      const btn = document.getElementById('json-copy-btn');
      const orig = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = orig, 1400);
    }

    // Close modals on Escape
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeExplorer();
        closeLogsModal();
      }
    });

    // Close on backdrop click
    document.getElementById('exp-overlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeExplorer();
    });

    document.getElementById('logs-overlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeLogsModal();
    });
  </script>

</body>
</html>
